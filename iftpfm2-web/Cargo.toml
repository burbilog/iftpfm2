[package]
name = "iftpfm2-web"
version = "0.1.0"
edition = "2021"

[dependencies]
iftpfm2 = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
constant_time_eq = "0.3"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "iftpfm2-web"
path = "src/main.rs"
